<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GloMeet — Meet the World</title>
<style>
:root{--p:#6c5ce7;--p2:#9b5cff;--bg:#f6f7fb;--text:#182033;--muted:#6b7488;--line:#e5e8ef;--danger:#e94b72;--ok:#18a66a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#faf9ff,#f4fbff);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.nav{height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:#fffffff0;backdrop-filter:blur(15px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.logo{font-size:25px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;color:transparent}.navright{display:flex;align-items:center;gap:10px}
.btn{padding:11px 17px;border-radius:13px;font-weight:800}.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 9px 24px #6c5ce733}.light{background:#f0f2f7;color:var(--text)}.danger{background:#fff0f3;color:var(--danger)}
.page{max-width:1160px;margin:auto;padding:40px 20px 70px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:35px 0}.hero h1{font-size:clamp(42px,6vw,70px);line-height:.98;letter-spacing:-3px;margin:15px 0}.gradient{background:linear-gradient(90deg,var(--p),#d24cff);-webkit-background-clip:text;color:transparent}.hero p{font-size:19px;line-height:1.65;color:var(--muted);max-width:620px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.heroCard,.panel,.side{background:#fff;border:1px solid var(--line);border-radius:25px;box-shadow:0 20px 60px #1d233c18}.heroCard{padding:20px}.world{height:300px;border-radius:20px;background:linear-gradient(135deg,#e9e4ff,#e9f8ff);display:grid;place-items:center;font-size:105px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.feature{padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff}.feature b{display:block;margin:8px 0}.feature span{color:var(--muted);font-size:14px;line-height:1.5}.dashboard{display:grid;grid-template-columns:270px 1fr;gap:20px}.side{padding:18px;height:max-content}.summary{text-align:center}.avatar{width:105px;height:105px;border-radius:50%;object-fit:cover;background:#eeeaff;display:grid;place-items:center;font-size:38px;margin:5px auto 12px}.avatarMini{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eeeaff;display:grid;place-items:center}.pill{display:flex;align-items:center;gap:8px;background:#f2efff;padding:7px 11px;border-radius:99px;font-weight:750}.menu{display:grid;gap:7px;margin-top:18px}.menu button{text-align:left;padding:12px;border-radius:12px;background:transparent;color:var(--muted);font-weight:750}.menu button.active,.menu button:hover{background:#f2efff;color:var(--p)}
.panel{padding:28px}.title{margin:0 0 7px;font-size:28px}.sub{color:var(--muted);margin:0 0 24px}.form{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px}.full{grid-column:1/-1}.field label{font-weight:800;font-size:14px}.field input,.field select,.field textarea{border:1px solid #dfe3ec;border-radius:12px;padding:12px 13px;outline:0;background:#fff}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #6c5ce71a}.formActions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.auth{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:30px 15px}.authCard{width:min(470px,100%);padding:30px;background:#fff;border:1px solid var(--line);border-radius:25px;box-shadow:0 20px 60px #1d233c18}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f3f7;padding:4px;border-radius:13px;margin:20px 0}.tabs button{padding:10px;border-radius:10px;background:transparent;color:var(--muted);font-weight:800}.tabs button.active{background:#fff;color:var(--p);box-shadow:0 2px 8px #0000000d}.status{margin-top:14px;padding:11px;border-radius:12px;background:#f1f3f7;color:var(--muted);font-size:14px}.error{background:#fff0f3;color:#a51f48}.success{background:#ecfff6;color:#087b4b}
.toast{position:fixed;right:18px;bottom:18px;background:#182033;color:#fff;padding:13px 16px;border-radius:13px;z-index:50;box-shadow:0 15px 35px #0003}
@media(max-width:850px){.hero,.dashboard{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:560px){.nav{padding:0 14px}.userName{display:none}.page{padding:25px 14px}.form{grid-template-columns:1fr}.full{grid-column:auto}.cards{grid-template-columns:1fr}.hero h1{letter-spacing:-2px}.panel,.authCard{padding:21px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyC4AH8xWMni12v42fiNN7IMAsPpNE4SyPo",authDomain:"globalmeet-dd883.firebaseapp.com",projectId:"globalmeet-dd883",storageBucket:"globalmeet-dd883.firebasestorage.app",messagingSenderId:"642474193366",appId:"1:642474193366:web:eb86b02a7573b738193477",measurementId:"G-27BSHLMKHZ"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),root=document.getElementById("app");
let user=null,profile=null,view="home";
const countries=["Georgia","United States","United Kingdom","Germany","France","Italy","Spain","Canada","Australia","Japan","Brazil","Turkey","Other"];
const langs=[["ka","ქართული"],["en","English"],["ru","Русский"],["de","Deutsch"],["fr","Français"],["es","Español"],["it","Italiano"],["tr","Türkçe"],["ar","العربية"],["ja","日本語"],["other","Other"]];
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const toast=m=>{let e=document.getElementById("toast");e.textContent=m;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),2800)};
const msg=e=>{let c=e?.code||"";if(c.includes("email-already"))return"That email is already registered.";if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return"Email or password is incorrect.";if(c.includes("weak-password"))return"Password must be at least 6 characters.";if(c.includes("invalid-email"))return"Enter a valid email.";if(c.includes("permission-denied"))return"Firestore permissions blocked this action. We will configure Rules next.";return e?.message||"Something went wrong."};
function av(p,mini=false){return p?.photo?`<img class="${mini?"avatarMini":"avatar"}" src="${esc(p.photo)}" alt="profile">`:`<div class="${mini?"avatarMini":"avatar"}>👤</div>`}
function nav(){return user?`<nav class="nav"><div class="logo">GloMeet</div><div class="navright"><div class="pill">${av(profile,true)}<span class="userName">${esc(profile?.name||user.email)}</span></div><button class="btn light" id="profileBtn">Profile</button><button class="btn danger" id="logout">Log out</button></div></nav>`:`<nav class="nav"><div class="logo">GloMeet</div><button class="btn primary" id="topLogin">Sign in</button></nav>`}
function landing(){root.innerHTML=nav()+`<main class="page"><section class="hero"><div><b style="color:var(--p)">🌍 Meet people worldwide</b><h1>Meet the world.<br><span class="gradient">Be yourself.</span></h1><p>GloMeet is a modern international platform for discovering people and making real connections. This first version connects your account to a real Firebase profile.</p><div class="actions"><button class="btn primary" id="join">Create your profile</button><button class="btn light" id="login">I already have an account</button></div></div><div class="heroCard"><div class="world">🌎</div></div></section><h2 class="title">GloMeet foundation</h2><p class="sub">Profile first. Then we build matching, chat, live video and translation on top of it.</p><div class="cards"><div class="feature">👤<b>Real profiles</b><span>Stored in Cloud Firestore using each Firebase user's unique ID.</span></div><div class="feature">🌐<b>Global ready</b><span>Country, city, gender and language are ready for future discovery.</span></div><div class="feature">🎥<b>Live next</b><span>Random video, chat and translation will be added in later stages.</span></div></div></main>`;document.getElementById("join").onclick=()=>authPage("reg");document.getElementById("login").onclick=()=>authPage("login");if(document.getElementById("topLogin"))document.getElementById("topLogin").onclick=()=>authPage("login")}
function authPage(mode){root.innerHTML=nav()+`<main class="auth"><section class="authCard"><div class="logo">GloMeet</div><h2>${mode==="login"?"Welcome back":"Create your account"}</h2><p class="sub">${mode==="login"?"Sign in to your account.":"Create your free GloMeet account."}</p><div class="tabs"><button id="tl" class="${mode==="login"?"active":""}">Sign in</button><button id="tr" class="${mode==="reg"?"active":""}">Register</button></div><form id="af">${mode==="reg"?`<div class="field" style="margin-bottom:14px"><label>Name</label><input id="an" required maxlength="40" placeholder="Your name"></div>`:""}<div class="field" style="margin-bottom:14px"><label>Email</label><input id="ae" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="ap" type="password" required minlength="6" autocomplete="${mode==="login"?"current-password":"new-password"}"></div><button class="btn primary" style="width:100%;margin-top:18px">${mode==="login"?"Sign in":"Create account"}</button><div id="as" class="status hidden"></div></form></section></main>`;tl.onclick=()=>authPage("login");tr.onclick=()=>authPage("reg");af.onsubmit=async e=>{e.preventDefault();let s=document.getElementById("as");s.className="status";s.textContent="Please wait...";try{if(mode==="reg"){let n=an.value.trim(),c=await createUserWithEmailAndPassword(auth,ae.value.trim(),ap.value);await updateProfile(c.user,{displayName:n});await setDoc(doc(db,"users",c.user.uid),{name:n,age:null,country:"",city:"",gender:"",language:"en",bio:"",photo:"",interests:[],online:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});toast("Account created.")}else await signInWithEmailAndPassword(auth,ae.value.trim(),ap.value)}catch(e){s.className="status error";s.textContent=msg(e)}}}
async function load(u){let r=doc(db,"users",u.uid),s=await getDoc(r);if(s.exists())return s.data();let p={name:u.displayName||"",age:null,country:"",city:"",gender:"",language:"en",bio:"",photo:"",interests:[],online:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp()};await setDoc(r,p);return p}
function dashboard(){root.innerHTML=nav()+`<main class="page"><div class="dashboard"><aside class="side"><div class="summary">${av(profile)}<h3>${esc(profile?.name||"New member")}</h3><p style="color:var(--muted)">${esc([profile?.city,profile?.country].filter(Boolean).join(", "))}</p><b style="color:var(--ok)">● Online</b></div><div class="menu"><button id="mh" class="${view==="home"?"active":""}">🏠 Overview</button><button id="mp" class="${view==="profile"?"active":""}">👤 My profile</button></div></aside><section>${view==="profile"?form():overview()}</section></div></main>`;document.getElementById("logout").onclick=()=>signOut(auth);document.getElementById("profileBtn").onclick=()=>{view="profile";dashboard()};mh.onclick=()=>{view="home";dashboard()};mp.onclick=()=>{view="profile";dashboard()};if(view==="profile")bindForm()}
function overview(){return`<div class="panel"><h2 class="title">Welcome, ${esc(profile?.name||"GloMeet member")} 👋</h2><p class="sub">Your real Firebase profile is ready. Complete it before we add discovery, matches, chat and live video.</p><div class="cards"><div class="feature">👤<b>Profile</b><span>Edit your name, age, country, city, language and bio.</span></div><div class="feature">❤️<b>Match — next</b><span>Mutual likes will be added after the profile stage.</span></div><div class="feature">🎥<b>Live — next</b><span>Random video chat and translation will be built next.</span></div></div><button class="btn primary" id="edit" style="margin-top:22px">Edit my profile</button></div>`}
function form(){let p=profile||{};return`<div class="panel"><h2 class="title">My profile</h2><p class="sub">Changes are saved to your Firebase user document.</p><form id="pf"><div class="form"><div class="field"><label>Name</label><input id="pn" maxlength="40" required value="${esc(p.name)}"></div><div class="field"><label>Age</label><input id="pa" type="number" min="18" max="100" value="${p.age??""}" placeholder="18+"></div><div class="field"><label>Country</label><select id="pc"><option value="">Choose country</option>${countries.map(x=>`<option ${p.country===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>City</label><input id="pcy" value="${esc(p.city)}"></div><div class="field"><label>Gender</label><select id="pg"><option value="">Choose</option><option value="male" ${p.gender==="male"?"selected":""}>Male</option><option value="female" ${p.gender==="female"?"selected":""}>Female</option><option value="other" ${p.gender==="other"?"selected":""}>Other</option></select></div><div class="field"><label>Language</label><select id="pl">${langs.map(x=>`<option value="${x[0]}" ${p.language===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div><div class="field full"><label>Profile photo URL <small>(temporary)</small></label><input id="pp" value="${esc(p.photo)}" placeholder="https://..."></div><div class="field full"><label>About me</label><textarea id="pb" maxlength="500">${esc(p.bio)}</textarea></div></div><div class="formActions"><button type="button" class="btn light" id="cancel">Cancel</button><button class="btn primary">Save profile</button></div><div id="ps" class="status hidden"></div></form></div>`}
function bindForm(){edit?.addEventListener("click",()=>{view="profile";dashboard()});cancel.onclick=()=>{view="home";dashboard()};pf.onsubmit=async e=>{e.preventDefault();let s=document.getElementById("ps"),age=pa.value?Number(pa.value):null;if(age!==null&&(!Number.isInteger(age)||age<18||age>100)){s.className="status error";s.textContent="Age must be between 18 and 100.";return}s.className="status";s.textContent="Saving...";let d={name:pn.value.trim(),age,country:pc.value,city:pcy.value.trim(),gender:pg.value,language:pl.value,photo:pp.value.trim(),bio:pb.value.trim(),updatedAt:serverTimestamp()};try{await updateDoc(doc(db,"users",user.uid),d);profile={...profile,...d};if(user.displayName!==d.name)await updateProfile(user,{displayName:d.name});s.className="status success";s.textContent="Profile saved.";toast("Profile updated.");setTimeout(()=>{view="home";dashboard()},600)}catch(e){s.className="status error";s.textContent=msg(e)}}}
onAuthStateChanged(auth,async u=>{user=u;if(u){try{profile=await load(u);dashboard()}catch(e){root.innerHTML=nav()+`<main class="page"><div class="panel"><h2>Profile could not be loaded</h2><p>${esc(msg(e))}</p></div></main>`}}else{profile=null;view="home";landing()}});
</script>
</body>
</html>
